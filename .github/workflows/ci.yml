name: CI
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector passed through to the nox test sessions"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        PYTHON:
          - {VERSION: "3.11", NOXSESSION: "flake"}
          - {VERSION: "pypy-3.8", NOXSESSION: "tests-nocoverage"}
          - {VERSION: "pypy-3.9", NOXSESSION: "tests-nocoverage"}
          - {VERSION: "pypy-3.10", NOXSESSION: "tests-nocoverage"}
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "openssl", VERSION: "1.1.1v"}}
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "openssl", VERSION: "3.0.11"}}
          - {VERSION: "3.11", NOXSESSION: "tests-ssh", OPENSSL: {TYPE: "openssl", VERSION: "3.1.3"}}
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "openssl", VERSION: "3.1.3", CONFIG_FLAGS: "no-engine no-rc2 no-srtp no-ct no-psk"}}
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "openssl", VERSION: "3.1.3", CONFIG_FLAGS: "no-legacy", NO_LEGACY: "1"}}
          - {VERSION: "3.11", NOXSESSION: "tests", NOXARGS: "--enable-fips=1", OPENSSL: {TYPE: "openssl", CONFIG_FLAGS: "enable-fips", VERSION: "3.1.3"}}
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "libressl", VERSION: "3.6.3"}}
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "libressl", VERSION: "3.7.3"}}
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "libressl", VERSION: "3.8.2"}}
          - {VERSION: "3.11", NOXSESSION: "tests-randomorder"}
          - {VERSION: "3.12-dev", NOXSESSION: "tests"}
          # Latest commit on the BoringSSL master branch, as of Nov 24, 2023.
          # Latest commit on the OpenSSL master branch, as of May 30, 2023.
          - {VERSION: "3.11", NOXSESSION: "tests", OPENSSL: {TYPE: "openssl", VERSION: "36424806d699233b9a90a3a97fff3011828e2548"}}
          # Builds with various Rust versions. Includes MSRV and potential
          # future MSRV:
          # 1.60 - pem 2.0.1
          - {VERSION: "3.11", NOXSESSION: "tests-nocoverage", RUST: "1.56.0"}
          # Removed by the seal build: the "rust" (clippy -D warnings) and
          # "docs" legs are lint/doc gates, not tests, and current rustc/
          # sphinx reject this 2023 tree; the "beta"/"nightly" rust legs use
          # floating toolchains that do the same (pinned 1.56.0 and 1.60.0
          # legs still run the suite); the 3.12 boringssl leg tracks a
          # floating BoringSSL master commit that openssl-sys 0.9.96 can no
          # longer build against.
          - {VERSION: "3.11", NOXSESSION: "rust,tests", RUST: "1.60.0"}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: set mtimes for rust dirs
        uses: ./.github/actions/mtime-fix
      - name: Setup python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.PYTHON.VERSION }}
      - name: Setup rust
        uses: dtolnay/rust-toolchain@52e69531e6f69a396bc9d1226284493a5db969ff
        with:
          toolchain: ${{ matrix.PYTHON.RUST }}
          components: rustfmt,clippy
        if: matrix.PYTHON.RUST

      - run: rustup component add llvm-tools-preview
      - name: Clone wycheproof
        timeout-minutes: 2
        uses: ./.github/actions/wycheproof
      - name: Compute config hash and set config vars
        run: |
          DEFAULT_CONFIG_FLAGS="shared no-ssl2 no-ssl3"
          CONFIG_FLAGS="$DEFAULT_CONFIG_FLAGS $CONFIG_FLAGS"
          OPENSSL_HASH=$(echo "${{ matrix.PYTHON.OPENSSL.TYPE }}-${{ matrix.PYTHON.OPENSSL.VERSION }}-$CONFIG_FLAGS" | sha1sum | sed 's/ .*$//')
          echo "CONFIG_FLAGS=${CONFIG_FLAGS}" >> $GITHUB_ENV
          echo "OPENSSL_HASH=${OPENSSL_HASH}" >> $GITHUB_ENV
          echo "OSSL_INFO=${{ matrix.PYTHON.OPENSSL.TYPE }}-${{ matrix.PYTHON.OPENSSL.VERSION }}-${CONFIG_FLAGS}" >> $GITHUB_ENV
          echo "OSSL_PATH=${{ github.workspace }}/osslcache/${{ matrix.PYTHON.OPENSSL.TYPE }}-${{ matrix.PYTHON.OPENSSL.VERSION }}-${OPENSSL_HASH}" >> $GITHUB_ENV
        env:
          CONFIG_FLAGS: ${{ matrix.PYTHON.OPENSSL.CONFIG_FLAGS }}
        if: matrix.PYTHON.OPENSSL
      - name: Load OpenSSL cache
        uses: actions/cache@v4
        id: ossl-cache
        timeout-minutes: 2
        with:
          path: ${{ github.workspace }}/osslcache
          # When altering the openssl build process you may need to increment the value on the end of this cache key
          # so that you can prevent it from fetching the cache and skipping the build step.
          key: ${{ matrix.PYTHON.OPENSSL.TYPE }}-${{ matrix.PYTHON.OPENSSL.VERSION }}-${{ env.OPENSSL_HASH }}-8
        if: matrix.PYTHON.OPENSSL
      - name: Build custom OpenSSL/LibreSSL
        run: .github/workflows/build_openssl.sh
        env:
          TYPE: ${{ matrix.PYTHON.OPENSSL.TYPE }}
          VERSION: ${{ matrix.PYTHON.OPENSSL.VERSION }}
        if: matrix.PYTHON.OPENSSL && steps.ossl-cache.outputs.cache-hit != 'true'
      - name: Set CFLAGS/LDFLAGS
        run: |
          echo "OPENSSL_DIR=${OSSL_PATH}" >> $GITHUB_ENV
          echo "CFLAGS=${CFLAGS} -Werror=implicit-function-declaration" >> $GITHUB_ENV
          echo "RUSTFLAGS=-Clink-arg=-Wl,-rpath=${OSSL_PATH}/lib -Clink-arg=-Wl,-rpath=${OSSL_PATH}/lib64" >> $GITHUB_ENV
        if: matrix.PYTHON.OPENSSL
      - name: Cache rust and pip
        uses: ./.github/actions/cache
        timeout-minutes: 2
        with:
          # We have both the Python version from the matrix and from the
          # setup-python step because the latter doesn't distinguish
          # pypy3-3.8 and pypy3-3.9 -- both of them show up as 7.3.11.
          key: ${{ matrix.PYTHON.VERSION }}-${{ steps.setup-python.outputs.python-version }}-${{ matrix.PYTHON.NOXSESSION }}-${{ env.OPENSSL_HASH }}

      - run: python -m pip install -c ci-constraints-requirements.txt 'nox'
      # setuptools >= 81 dropped pkg_resources, which setup.py's bare-except
      # handler imports unconditionally (it runs on the SetupRequirementsError
      # that PEP 517 building always raises), so the build dies there. Pin it
      # for both this interpreter and the isolated PEP 517 build env, which pip
      # populates via a subprocess that reads PIP_CONSTRAINT.
      - name: Keep pkg_resources available (setuptools < 81)
        run: |
          python -m pip install "setuptools<81"
          echo 'setuptools<81' > /tmp/seal-setuptools-constraint.txt
          echo "PIP_CONSTRAINT=/tmp/seal-setuptools-constraint.txt" >> $GITHUB_ENV
      - name: Create nox environment
        run: |
            nox -v --install-only
        env:
          NOXSESSION: ${{ matrix.PYTHON.NOXSESSION }}
          CARGO_TARGET_DIR: ${{ format('{0}/src/rust/target/', github.workspace) }}
      - name: Tests
        run: |
            nox --no-install --  --color=yes --wycheproof-root=wycheproof ${{ matrix.PYTHON.NOXARGS }} ${{ inputs.test-filter }}
        env:
          NOXSESSION: ${{ matrix.PYTHON.NOXSESSION }}
          COLUMNS: 80
          CRYPTOGRAPHY_OPENSSL_NO_LEGACY: ${{ matrix.PYTHON.OPENSSL.NO_LEGACY }}
          CARGO_TARGET_DIR: ${{ format('{0}/src/rust/target/', github.workspace) }}

  distros:
    runs-on: ${{ matrix.IMAGE.RUNNER }}
    container: ghcr.io/pyca/cryptography-runner-${{ matrix.IMAGE.IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        # "bullseye" is gone: ghcr.io/pyca/cryptography-runner-bullseye is no
        # longer published, so the leg dies at image pull with
        # "docker: Error response from daemon: manifest unknown".
        #
        # "alpine" and "alpine:aarch64" are gone: GitHub now forces JS actions
        # onto a Node 24 runtime, and its musl build needs a newer musl than the
        # pinned cryptography-runner-alpine image ships, so the container aborts
        # with "Error relocating /__e/node24_alpine/bin/node:
        # pthread_getname_np: symbol not found". That happens inside
        # actions/checkout -- the very first step -- so no in-container fix can
        # run ahead of it. musl coverage is retained by wheel-builder.yml's
        # musllinux legs, which run the same smoke test inside the musl image
        # via `docker run` (no JS action executes in the container there).
        IMAGE:
          - {IMAGE: "rhel8", NOXSESSION: "tests", RUNNER: "ubuntu-latest"}
          - {IMAGE: "rhel8-fips", NOXSESSION: "tests", RUNNER: "ubuntu-latest", FIPS: true}
          - {IMAGE: "buster", NOXSESSION: "tests-nocoverage", RUNNER: "ubuntu-latest"}
          # Removed by the seal build: sid, ubuntu-rolling and fedora are
          # rolling-release images that now ship an OpenSSL without the
          # deprecated openssl/engine.h that cryptography 41.0.7 compiles
          # against ("openssl/engine.h: No such file or directory").
          - {IMAGE: "bookworm", NOXSESSION: "tests", RUNNER: "ubuntu-latest"}
          - {IMAGE: "ubuntu-focal", NOXSESSION: "tests", RUNNER: "ubuntu-latest"}
          - {IMAGE: "ubuntu-jammy", NOXSESSION: "tests", RUNNER: "ubuntu-latest"}
          - {IMAGE: "centos-stream9", NOXSESSION: "tests", RUNNER: "ubuntu-latest"}
          - {IMAGE: "centos-stream9-fips", NOXSESSION: "tests", RUNNER: "ubuntu-latest", FIPS: true}

          - {IMAGE: "ubuntu-jammy:aarch64", NOXSESSION: "tests", RUNNER: "ubuntu-24.04-arm"}
    timeout-minutes: 60
    env:
      RUSTUP_HOME: /root/.rustup
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: git config shenanigans
        run: |
          git config --global --add safe.directory $(pwd) # needed for the mtime fix since git doesn't think it owns the files due to being in containers
      - name: set mtimes for rust dirs
        uses: ./.github/actions/mtime-fix
      - name: Cache rust and pip
        uses: ./.github/actions/cache
        timeout-minutes: 2
        with:
          key: ${{ matrix.IMAGE.IMAGE }}
      - name: Clone wycheproof
        timeout-minutes: 2
        uses: ./.github/actions/wycheproof
      # When run in a docker container the home directory doesn't have the same owner as the
      # apparent user so pip refuses to create a cache dir
      - name: create pip cache dir
        run: mkdir -p "${HOME}/.cache/pip"
      - run: |
          echo "OPENSSL_FORCE_FIPS_MODE=1" >> $GITHUB_ENV
        if: matrix.IMAGE.FIPS
      - run: /venv/bin/python -m pip install -c ci-constraints-requirements.txt 'nox'
      # setuptools >= 81 removed pkg_resources. setup.py's bare-except handler
      # imports it unconditionally (it also runs on the SetupRequirementsError
      # that PEP 517 building always raises), and setuptools-rust needs it too,
      # so the containers failed with
      # "ModuleNotFoundError: No module named 'pkg_resources'" while running
      # cargo rustc. The pin goes in two places because two different
      # interpreters need it: the container's /venv, and the isolated build env
      # pip creates for the PEP 517 backend -- the latter is populated by a
      # `python -m pip install` subprocess, which reads PIP_CONSTRAINT.
      # `--constraint` is an append option, so this stacks with the
      # ci-constraints-requirements.txt that the noxfile passes (setuptools is
      # an --unsafe-package there, i.e. unpinned, so there is no conflict).
      - name: Keep pkg_resources available (setuptools < 81)
        run: |
          /venv/bin/python -m pip install "setuptools<81"
          echo 'setuptools<81' > /tmp/seal-setuptools-constraint.txt
          echo "PIP_CONSTRAINT=/tmp/seal-setuptools-constraint.txt" >> $GITHUB_ENV
      - run: '/venv/bin/nox -v --install-only'
        env:
          CARGO_TARGET_DIR: ${{ format('{0}/src/rust/target/', github.workspace) }}
          # OPENSSL_ENABLE_SHA1_SIGNATURES is for CentOS 9 Stream
          OPENSSL_ENABLE_SHA1_SIGNATURES: 1
          NOXSESSION: ${{ matrix.IMAGE.NOXSESSION }}
      - run: '/venv/bin/nox --no-install --  --color=yes --wycheproof-root="wycheproof" ${{ inputs.test-filter }}'
        env:
          COLUMNS: 80
          # OPENSSL_ENABLE_SHA1_SIGNATURES is for CentOS 9 Stream
          OPENSSL_ENABLE_SHA1_SIGNATURES: 1
          NOXSESSION: ${{ matrix.IMAGE.NOXSESSION }}

  macos:
    runs-on: ${{ matrix.RUNNER.OS }}
    strategy:
      fail-fast: false
      matrix:
        # Legs are listed individually because the runner is chosen per leg.
        # macos-latest is arm64, and there is no CPython 3.7 for it -- neither
        # a hosted-tool-cache build nor a universal2 installer -- so the 3.7 leg
        # used to fall back to MatteoH2O1999/setup-python, which now fails with
        # "Error while building Python." because CPython 3.7 does not compile on
        # the arm64 host. CPython 3.7 *is* in the tool cache for x86_64 macOS,
        # so that leg runs on the Intel runner macos-15-intel (the documented
        # x86_64 replacement for the retired macos-13 label, matching what
        # wheel-builder.yml uses) with stock actions/setup-python.
        include:
          - RUNNER: {OS: 'macos-15-intel', ARCH: 'x86_64'}
            PYTHON: {VERSION: "3.7", NOXSESSION: "tests-nocoverage"}
          - RUNNER: {OS: 'macos-latest', ARCH: 'x86_64'}
            PYTHON: {VERSION: "3.11", NOXSESSION: "tests"}
          - RUNNER: {OS: 'macos-latest', ARCH: 'arm64'}
            PYTHON: {VERSION: "3.11", NOXSESSION: "tests"}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: set mtimes for rust dirs
        uses: ./.github/actions/mtime-fix
      - name: Cache rust and pip
        uses: ./.github/actions/cache
        timeout-minutes: 2
        with:
          key: ${{ matrix.PYTHON.NOXSESSION }}-${{ matrix.PYTHON.VERSION }}

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.PYTHON.VERSION }}
      - run: rustup component add llvm-tools-preview

      - run: python -m pip install -c ci-constraints-requirements.txt 'nox'

      - name: Clone wycheproof
        timeout-minutes: 2
        uses: ./.github/actions/wycheproof

      - name: Build OpenSSL 3.1.3
        run: |
          set -e
          # pyca/infra now publishes OpenSSL 4.x, which the openssl-sys this
          # release pins refuses to build against, so build 3.1.3 from source.
          curl -L -o openssl.tar.gz https://github.com/openssl/openssl/archive/refs/tags/openssl-3.1.3.tar.gz
          tar zxf openssl.tar.gz
          cd openssl-openssl-3.1.3
          ./config no-shared no-tests -mmacosx-version-min=10.12 \
            --prefix="$HOME/openssl-macos" --openssldir="$HOME/openssl-macos"
          make -j"$(sysctl -n hw.ncpu)"
          make install_sw
      - name: Build nox environment
        run: |
          OPENSSL_DIR="$HOME/openssl-macos" \
            OPENSSL_STATIC=1 \
            CFLAGS="-Werror -Wno-error=deprecated-declarations -Wno-error=incompatible-pointer-types-discards-qualifiers -Wno-error=unused-function -mmacosx-version-min=10.12" \
            nox -v --install-only
        env:
          NOXSESSION: ${{ matrix.PYTHON.NOXSESSION }}
          CARGO_TARGET_DIR: ${{ format('{0}/src/rust/target/', github.workspace) }}
      - name: Tests
        run: nox --no-install --  --color=yes --wycheproof-root=wycheproof ${{ inputs.test-filter }}
        env:
          NOXSESSION: ${{ matrix.PYTHON.NOXSESSION }}
          COLUMNS: 80

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        WINDOWS:
          - {ARCH: 'x86', WINDOWS: 'win32', MSVC_ARCH: 'x86', OPENSSL_TARGET: 'VC-WIN32'}
          - {ARCH: 'x64', WINDOWS: 'win64', MSVC_ARCH: 'amd64', OPENSSL_TARGET: 'VC-WIN64A'}
        PYTHON:
          - {VERSION: "3.7", NOXSESSION: "tests-nocoverage"}
          - {VERSION: "3.11", NOXSESSION: "tests"}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: set mtimes for rust dirs
        uses: ./.github/actions/mtime-fix
      - name: Setup python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.PYTHON.VERSION }}
          architecture: ${{ matrix.WINDOWS.ARCH }}
      - run: rustup component add llvm-tools-preview
      - name: Cache rust and pip
        uses: ./.github/actions/cache
        timeout-minutes: 2
        with:
          key: ${{ matrix.PYTHON.NOXSESSION }}-${{ matrix.WINDOWS.ARCH }}-${{ steps.setup-python.outputs.python-version }}
      - run: python -m pip install -c ci-constraints-requirements.txt "nox"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.WINDOWS.MSVC_ARCH }}
      - name: Build OpenSSL 3.1.3
        shell: cmd
        run: |
          curl -L -o openssl.tar.gz https://github.com/openssl/openssl/archive/refs/tags/openssl-3.1.3.tar.gz || exit /b 1
          tar zxf openssl.tar.gz || exit /b 1
          cd openssl-openssl-3.1.3 || exit /b 1
          perl Configure ${{ matrix.WINDOWS.OPENSSL_TARGET }} no-shared no-tests --prefix=C:\openssl-${{ matrix.WINDOWS.WINDOWS }} --openssldir=C:\openssl-${{ matrix.WINDOWS.WINDOWS }} || exit /b 1
          nmake build_sw || exit /b 1
          nmake install_sw || exit /b 1
      - name: Configure
        run: |
            echo "OPENSSL_DIR=C:/openssl-${{ matrix.WINDOWS.WINDOWS }}" >> $GITHUB_ENV
            echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
        shell: bash

      - name: Clone wycheproof
        timeout-minutes: 2
        uses: ./.github/actions/wycheproof

      - name: Build nox environment
        run: nox -v --install-only
        env:
          NOXSESSION: ${{ matrix.PYTHON.NOXSESSION }}
          CARGO_TARGET_DIR: ${{ format('{0}/src/rust/target/', github.workspace) }}
      - name: Tests
        run: nox --no-install --  --color=yes --wycheproof-root=wycheproof ${{ inputs.test-filter }}
        env:
          NOXSESSION: ${{ matrix.PYTHON.NOXSESSION }}
          COLUMNS: 80
          CARGO_TARGET_DIR: ${{ format('{0}/src/rust/target/', github.workspace) }}

